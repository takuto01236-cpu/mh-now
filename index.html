<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンハンNow 狩りたい執念共有アプリ</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #ff9800;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        h1, h2 { text-align: center; color: var(--accent-color); margin-top: 10px; margin-bottom: 15px; }
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        .monster-card {
            background-color: var(--card-bg);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .monster-card span {
            font-weight: bold;
            font-size: 15px;
        }
        .monster-card select {
            width: 90%;
            padding: 6px;
            font-size: 14px;
            margin-bottom: 0;
            border-radius: 6px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #666;
            text-align: center;
        }
        .monster-card.wanted {
            border-color: var(--accent-color);
            background-color: #3d2a10;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.3);
        }
        .monster-card.wanted select {
            border-color: var(--accent-color);
            background: #2d2d2d;
            color: var(--accent-color);
            font-weight: bold;
        }
        /* 一目でわかる相手のターゲットエリア（最上部用） */
        .friends-section {
            margin-top: 10px;
            margin-bottom: 25px;
            background-color: #252525;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        .friend-status {
            text-align: center;
        }
        .friend-name { font-weight: bold; color: var(--accent-color); font-size: 18px; margin-bottom: 8px; }
        .wanted-tags { margin-top: 8px; }
        .tag {
            display: inline-block;
            background: #444;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin: 4px;
        }
        .tag.active { background: var(--accent-color); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🍖 MH Now 探してますリスト</h1>

    <!-- 💥 【位置変更】アプリを開いて一番最初に目に入る場所に移動 -->
    <div class="friends-section">
        <div id="friendsStatus"></div>
    </div>

    <hr style="border: 0; border-top: 1px solid #444; margin-bottom: 20px;">

    <label for="userSelect">👤 あなたはだれ？</label>
    <select id="userSelect" onchange="changeUser()">
        <option value="user1">じぶん (拓斗)</option>
        <option value="user2">天飛</option>
    </select>

    <h2>🎯 あなたが今欲しいモンスター</h2>
    <div class="container" id="monsterGrid"></div>

    <!-- Firebase SDK の読み込み -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1XKxMDakhQ4hYKBpSEkof9oLz8YMyBzE",
            authDomain: "mh-now-61a3c.firebaseapp.com",
            databaseURL: "https://mh-now-61a3c-default-rtdb.firebaseio.com",
            projectId: "mh-now-61a3c",
            storageBucket: "mh-now-61a3c.firebasestorage.app",
            messagingSenderId: "813261960972",
            appId: "1:813261960972:web:6f6daa3767a42a5d7f7b29",
            measurementId: "G-ZXZRERG20V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const monsters = [
            "リオレウス", "リオレイア", "ディアブロス", "ジンオウガ", 
             "ネルギガンテ", "イビルジョー", "タマミツネ",
            "クシャルダオラ", "テオ・テスカトル"
        ];

        const userMap = {
            user1: "拓斗",
            user2: "天飛"
        };

        let currentUser = "user1";
        let globalState = {};

        const monsterGrid = document.getElementById("monsterGrid");
        window.changeUser = () => {
            currentUser = document.getElementById("userSelect").value;
            renderMyList();
            renderFriendsList();
        };

        function renderMyList() {
            monsterGrid.innerHTML = "";
            const myData = globalState[currentUser] || {};
            
            monsters.forEach(monster => {
                let selectedStar = myData[monster] || "";
                if (selectedStar === true || selectedStar === "true") selectedStar = "8"; 
                
                const isWanted = selectedStar !== "";
                
                const card = document.createElement("div");
                card.className = `monster-card ${isWanted ? 'wanted' : ''}`;
                
                const nameSpan = document.createElement("span");
                nameSpan.innerText = monster;
                card.appendChild(nameSpan);
                
                const starSelect = document.createElement("select");
                starSelect.innerHTML = `
                    <option value="">✕ 探してない</option>
                    <option value="5">★5</option>
                    <option value="6">★6</option>
                    <option value="7">★7</option>
                    <option value="8">★8</option>
                    <option value="9">★9</option>
                    <option value="10">★10</option>
                `;
                starSelect.value = selectedStar;
                starSelect.onchange = (e) => changeMonsterStar(monster, e.target.value);
                
                card.appendChild(starSelect);
                monsterGrid.appendChild(card);
            });
        }

        function changeMonsterStar(monster, starValue) {
            globalState[currentUser] = globalState[currentUser] || {};
            
            if (starValue === "") {
                delete globalState[currentUser][monster];
                set(ref(db, `sharing-list/${currentUser}/${monster}`), null);
            } else {
                globalState[currentUser][monster] = starValue;
                set(ref(db, `sharing-list/${currentUser}/${monster}`), starValue);
            }
            renderMyList();
            renderFriendsList();
        }

        // DBの監視
        onValue(ref(db, 'sharing-list'), (snapshot) => {
            globalState = snapshot.val() || {};
            renderMyList();
            renderFriendsList();
        }, (error) => {
            console.log("Database connection error");
        });

        // 友達のリストを描画
        function renderFriendsList() {
            const friendsStatusDiv = document.getElementById("friendsStatus");
            friendsStatusDiv.innerHTML = "";

            Object.keys(userMap).forEach(userKey => {
                if (userKey === currentUser) return; // じぶんは上に出さない

                const userData = globalState[userKey] || {};
                const wantedMonsters = Object.keys(userData).filter(key => userData[key] && userData[key] !== "");

                const friendDiv = document.createElement("div");
                friendDiv.className = "friend-status";
                
                let tagsHtml = wantedMonsters.map(m => {
                    const star = userData[m];
                    const starText = (star === true || star === "true") ? "★8" : `★${star}`;
                    return `<span class="tag active">${m} (${starText})</span>`;
                }).join("");
                
                if (wantedMonsters.length === 0) tagsHtml = "<span class='tag'>特になし（いつでもOK！）</span>";

                friendDiv.innerHTML = `
                    <div class="friend-name">👥 ${userMap[userKey]} が今探してるボス</div>
                    <div class="wanted-tags">${tagsHtml}</div>
                `;
                friendsStatusDiv.appendChild(friendDiv);
            });
        }

        renderMyList();
        renderFriendsList();
    </script>
</body>
</html>
