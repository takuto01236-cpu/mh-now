<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンハンNow 狩りたい執念共有アプリ</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #ff9800;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        h1, h2 { text-align: center; color: var(--accent-color); margin-top: 10px; margin-bottom: 15px; }
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
            gap: 10px;
        }
        .monster-card {
            background-color: var(--card-bg);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 10px 4px 8px 4px;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 155px;
            cursor: pointer;
        }
        
        .monster-icon-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }
        .monster-icon-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; 
        }

        .monster-name {
            font-weight: bold;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .star-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            width: 100%;
            margin-top: 4px;
        }
        .star-btn {
            background: #1a1a1a;
            color: #777;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 10px;
            padding: 3px 0;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: all 0.1s ease;
        }
        .monster-card.wanted {
            border-color: var(--accent-color);
            background-color: #3d2a10;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.3);
        }
        .monster-card.wanted .star-btn {
            color: #aaa;
            border-color: #555;
        }
        .monster-card.wanted .star-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }
        .friends-section {
            margin-top: 10px;
            margin-bottom: 25px;
            background-color: #252525;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        .friend-status {
            text-align: center;
        }
        .friend-name { font-weight: bold; color: var(--accent-color); font-size: 18px; margin-bottom: 8px; }
        .wanted-tags { margin-top: 8px; }
        .tag {
            display: inline-block;
            background: #444;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin: 4px;
        }
        .tag.active { background: var(--accent-color); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🍖 MH Now 探してますリスト</h1>

    <div class="friends-section">
        <div id="friendsStatus"></div>
    </div>

    <hr style="border: 0; border-top: 1px solid #444; margin-bottom: 20px;">

    <label for="userSelect">👤 あなたはだれ？</label>
    <select id="userSelect" onchange="changeUser()">
        <option value="user1">じぶん (拓斗)</option>
        <option value="user2">天飛</option>
    </select>

    <h2>🎯 あなたが今欲しいモンスター</h2>
    <div class="container" id="monsterGrid"></div>

    <!-- Firebase SDK の読み込み -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1XKxMDakhQ4hYKBpSEkof9oLz8YMyBzE",
            authDomain: "mh-now-61a3c.firebaseapp.com",
            databaseURL: "https://mh-now-61a3c-default-rtdb.firebaseio.com",
            projectId: "mh-now-61a3c",
            storageBucket: "mh-now-61a3c.firebasestorage.app",
            messagingSenderId: "813261960972",
            appId: "1:813261960972:web:6f6daa3767a42a5d7f7b29",
            measurementId: "G-ZXZRERG20V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🛠️ 全59種類のモンスターデータ（バグ修正済）
        const monsterData = {
            "ドスジャグラス": { id: 6, emoji: "🦎", color: "#aa9933" },
            "クルルヤック": { id: 7, emoji: "🦖", color: "#cc9966" },
            "プケプケ": { id: 8, emoji: "👅", color: "#338844" },
            "プケプケ亜種": { id: 31, emoji: "💧", color: "#3366aa" },
            "ボルボロス": { id: 9, emoji: "泥", color: "#665544" },
            "ドスギルオス": { id: 10, emoji: "🐍", color: "#444444" },
            "トビカガチ": { id: 11, emoji: "🐿️", color: "#6688aa" },
            "トビカガチ亜種": { id: 69, emoji: "🦅", color: "#443355" },
            "パオウルムー": { id: 12, emoji: "🎈", color: "#cccccc" },
            "パオウルムー亜種": { id: 36, emoji: "💤", color: "#444466" },
            "ジュラトドス": { id: 13, emoji: "🐟", color: "#556655" },
            "アンジャナフ": { id: 14, emoji: "🔥", color: "#aa4455" },
            "アンジャナフ亜種": { id: 60, emoji: "⚡", color: "#cc88aa" },
            "リオレイア": { id: 15, emoji: "🦅", color: "#2e5c1e" },
            "リオレイア亜種": { id: 20, emoji: "🌸", color: "#b53f77" },
            "リオレイア希少種": { id: 42, emoji: "✨", color: "#ccaa44" },
            "レイギエナ": { id: 16, emoji: "❄️", color: "#88aacc" },
            "ディアブロス": { id: 17, emoji: "🐂", color: "#7a5c33" },
            "ディアブロス亜種": { id: 19, emoji: "🖤", color: "#222222" },
            "リオレウス": { id: 18, emoji: "🐉", color: "#8b1e1e" },
            "リオレウス亜種": { id: 27, emoji: "🔷", color: "#1e5c8b" },
            "リオレウス希少種": { id: 43, emoji: "🌟", color: "#ddddee" },
            "ラドバルキン": { id: 21, emoji: "骨", color: "#444444" },
            "バフバロ": { id: 22, emoji: "🦣", color: "#887766" },
            "ベリオロス": { id: 23, emoji: "🐅", color: "#ddeeff" },
            "ジンオウガ": { id: 24, emoji: "⚡", color: "#1e5c7a" },
            "ジンオウガ亜種": { id: 72, emoji: "😈", color: "#551a1a" },
            "ツィツィヤック": { id: 28, emoji: "📸", color: "#556677" },
            "オドガロン": { id: 29, emoji: "爪", color: "#aa2222" },
            "オドガロン亜種": { id: 53, emoji: "💀", color: "#331111" },
            "イビルジョー": { id: 30, emoji: "🍏", color: "#1e3d1e" },
            "バサルモス": { id: 33, emoji: "岩", color: "#777777" },
            "フルフル": { id: 32, emoji: "🔌", color: "#eeeeee" },
            "タマミツネ": { id: 35, emoji: "🧼", color: "#a349a4" },
            "アケノシルム": { id: 38, emoji: "傘", color: "#cc4444" },
            "ラージャン": { id: 40, emoji: "🦍", color: "#cc9933" },
            "マガイマガド": { id: 39, emoji: "🐯", color: "#4a1e7a" },
            "ウルクスス": { id: 44, emoji: "🐰", color: "#ffffff" },
            "ラングロトラ": { id: 45, emoji: "🪀", color: "#aa4433" },
            "イソネミクニ": { id: 46, emoji: "🧜", color: "#445588" },
            "ティガレックス": { id: 47, emoji: "轟", color: "#cc7733" },
            "ティガレックス亜種": { id: 64, emoji: "黒", color: "#222222" },
            "バゼルギウス": { id: 49, emoji: "💣", color: "#665544" },
            "チャタカブラ": { id: 50, emoji: "🐸", color: "#557744" },
            "アオアシラ": { id: 51, emoji: "🐻", color: "#445533" },
            "ディノバルド": { id: 52, emoji: "🪓", color: "#aa3333" },
            "ドスフロギィ": { id: 55, emoji: "🧪", color: "#cc6633" },
            "ビシュテンゴ": { id: 56, emoji: "柿", color: "#aa8844" },
            "ブラントドス": { id: 57, emoji: "🦈", color: "#667788" },
            "ナルガクルガ": { id: 58, emoji: "🥷", color: "#222233" },
            "ルナガロン": { id: 61, emoji: "🐺", color: "#335577" },
            "ガランゴル": { id: 62, emoji: "🧱", color: "#555544" },
            "エスピナス": { id: 63, emoji: "🌵", color: "#335533" },
            "ケマトリス": { id: 66, emoji: "🐓", color: "#cc5533" },
            "ゴシャハギ": { id: 67, emoji: "👹", color: "#446688" },
            "ライゼクス": { id: 68, emoji: "🦟", color: "#557722" },
            "オロミドロ": { id: 70, emoji: "🪵", color: "#443322" },
            "セルレギオス": { id: 71, emoji: "🛩️", color: "#bb9944" },
            "ショウグンギザミ": { id: 73, emoji: "🦀", color: "#3355aa" }
        };

        const monsters = Object.keys(monsterData);

        const userMap = {
            user1: "拓斗",
            user2: "天飛"
        };

        let currentUser = "user1";
        let globalState = {};

        const monsterGrid = document.getElementById("monsterGrid");
        window.changeUser = () => {
            currentUser = document.getElementById("userSelect").value;
            renderMyList();
            renderFriendsList();
        };

        function formatStars(starStr) {
            if (!starStr || starStr === "all" || starStr === true || starStr === "true") return "指定なし";
            const stars = starStr.split(",").map(Number).sort((a, b) => a - b);
            if (stars.length === 0) return "指定なし";
            
            let isConsecutive = true;
            for (let i = 1; i < stars.length; i++) {
                if (stars[i] !== stars[i-1] + 1) {
                    isConsecutive = false;
                    break;
                }
            }
            if (isConsecutive && stars.length > 1) {
                return `★${stars[0]}〜${stars[stars.length-1]}`;
            } else {
                return stars.map(s => `★${s}`).join("・");
            }
        }

        function renderMyList() {
            monsterGrid.innerHTML = "";
            const myData = globalState[currentUser] || {};
            
            monsters.forEach(monster => {
                const starValue = myData[monster];
                const isWanted = starValue !== undefined && starValue !== null;
                
                const card = document.createElement("div");
                card.className = `monster-card ${isWanted ? 'wanted' : ''}`;
                card.onclick = () => toggleMonster(monster, starValue);
                
                const iconData = monsterData[monster] || { id: 0, emoji: "👾", color: "#444" };
                const iconWrapper = document.createElement("div");
                iconWrapper.className = "monster-icon-wrapper";
                iconWrapper.style.backgroundColor = iconData.color;
                iconWrapper.innerText = iconData.emoji;
                
                const img = document.createElement("img");
                img.src = `monster_${iconData.id}.png`;
                img.onload = () => { img.style.display = 'block'; }; 
                img.onerror = () => { img.style.display = 'none'; };  
                
                iconWrapper.appendChild(img);
                card.appendChild(iconWrapper);
                
                const nameDiv = document.createElement("div");
                nameDiv.className = "monster-name";
                let statusSubText = "";
                if (isWanted) {
                    statusSubText = `<div style="font-size:10px; color:var(--accent-color); margin-top:2px;">(${formatStars(starValue)})</div>`;
                }
                nameDiv.innerHTML = `<span>${monster}</span>${statusSubText}`;
                card.appendChild(nameDiv);
                
                const starContainer = document.createElement("div");
                starContainer.className = "star-container";
                const activeStars = (starValue && starValue !== "all" && starValue !== true && starValue !== "true") ? starValue.split(",") : [];
                
                ["5", "6", "7", "8", "9", "10"].forEach(star => {
                    const starBtn = document.createElement("div");
                    starBtn.className = `star-btn ${activeStars.includes(star) ? 'active' : ''}`;
                    starBtn.innerText = `★${star}`;
                    starBtn.onclick = (e) => {
                        e.stopPropagation();
                        clickStar(monster, starValue, star);
                    };
                    starContainer.appendChild(starBtn);
                });
                
                card.appendChild(starContainer);
                monsterGrid.appendChild(card);
            });
        }

        function toggleMonster(monster, currentStarValue) {
            const isWanted = currentStarValue !== undefined && currentStarValue !== null;
            globalState[currentUser] = globalState[currentUser] || {};
            
            if (isWanted) {
                delete globalState[currentUser][monster];
                set(ref(db, `sharing-list/${currentUser}/${monster}`), null);
            } else {
                globalState[currentUser][monster] = "all";
                set(ref(db, `sharing-list/${currentUser}/${monster}`), "all");
            }
            renderMyList();
            renderFriendsList();
        }

        function clickStar(monster, currentStarValue, clickedStar) {
            globalState[currentUser] = globalState[currentUser] || {};
            let activeStars = [];
            if (currentStarValue && currentStarValue !== "all" && currentStarValue !== true && currentStarValue !== "true") {
                activeStars = currentStarValue.split(",");
            }
            
            if (activeStars.includes(clickedStar)) {
                activeStars = activeStars.filter(s => s !== clickedStar);
            } else {
                activeStars.push(clickedStar);
            }
            activeStars.sort((a, b) => Number(a) - Number(b));
            
            if (activeStars.length === 0) {
                globalState[currentUser][monster] = "all";
                set(ref(db, `sharing-list/${currentUser}/${monster}`), "all");
            } else {
                const newValue = activeStars.join(",");
                globalState[currentUser][monster] = newValue;
                set(ref(db, `sharing-list/${currentUser}/${monster}`), newValue);
            }
            renderMyList();
            renderFriendsList();
        }

        onValue(ref(db, 'sharing-list'), (snapshot) => {
            globalState = snapshot.val() || {};
            renderMyList();
            renderFriendsList();
        }, (error) => {
            console.log("Database connection error");
        });

        function renderFriendsList() {
            const friendsStatusDiv = document.getElementById("friendsStatus");
            friendsStatusDiv.innerHTML = "";

            Object.keys(userMap).forEach(userKey => {
                if (userKey === currentUser) return;
                const userData = globalState[userKey] || {};
                const wantedMonsters = Object.keys(userData).filter(key => userData[key] && userData[key] !== "");

                const friendDiv = document.createElement("div");
                friendDiv.className = "friend-status";
                
                let tagsHtml = wantedMonsters.map(m => {
                    const star = userData[m];
                    const iconData = monsterData[m] || { emoji: "👾" };
                    return `<span class="tag active">${iconData.emoji} ${m} (${formatStars(star)})</span>`;
                }).join("");
                
                if (wantedMonsters.length === 0) tagsHtml = "<span class='tag'>特になし（いつでもOK！）</span>";

                friendDiv.innerHTML = `
                    <div class="friend-name">👥 ${userMap[userKey]} が今探してるボス</div>
                    <div class="wanted-tags">${tagsHtml}</div>
                `;
                friendsStatusDiv.appendChild(friendDiv);
            });
        }

        renderMyList();
        renderFriendsList();
    </script>
</body>
</html>
