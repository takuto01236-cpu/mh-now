<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンハンNow 狩りたい執念共有アプリ</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #ff9800;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        h1, h2 { text-align: center; color: var(--accent-color); margin-top: 10px; margin-bottom: 15px; }
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        .monster-card {
            background-color: var(--card-bg);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 110px;
            cursor: pointer;
        }
        .monster-name {
            font-weight: bold;
            font-size: 14px;
            word-break: break-all;
        }
        /* 星パッチ用のコンテナ */
        .star-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            width: 100%;
            margin-top: 8px;
        }
        .star-btn {
            background: #1a1a1a;
            color: #777;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 11px;
            padding: 4px 0;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: all 0.1s ease;
        }
        .monster-card.wanted {
            border-color: var(--accent-color);
            background-color: #3d2a10;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.3);
        }
        .monster-card.wanted .star-btn {
            color: #aaa;
            border-color: #555;
        }
        /* 選択された星のスタイル */
        .monster-card.wanted .star-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }
        /* 最上部の相手ターゲットエリア */
        .friends-section {
            margin-top: 10px;
            margin-bottom: 25px;
            background-color: #252525;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        .friend-status {
            text-align: center;
        }
        .friend-name { font-weight: bold; color: var(--accent-color); font-size: 18px; margin-bottom: 8px; }
        .wanted-tags { margin-top: 8px; }
        .tag {
            display: inline-block;
            background: #444;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin: 4px;
        }
        .tag.active { background: var(--accent-color); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🍖 MH Now 探してますリスト</h1>

    <div class="friends-section">
        <div id="friendsStatus"></div>
    </div>

    <hr style="border: 0; border-top: 1px solid #444; margin-bottom: 20px;">

    <label for="userSelect">👤 あなたはだれ？</label>
    <select id="userSelect" onchange="changeUser()">
        <option value="user1">じぶん (拓斗)</option>
        <option value="user2">天飛</option>
    </select>

    <h2>🎯 あなたが今欲しいモンスター</h2>
    <div class="container" id="monsterGrid"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1XKxMDakhQ4hYKBpSEkof9oLz8YMyBzE",
            authDomain: "mh-now-61a3c.firebaseapp.com",
            databaseURL: "https://mh-now-61a3c-default-rtdb.firebaseio.com",
            projectId: "mh-now-61a3c",
            storageBucket: "mh-now-61a3c.firebasestorage.app",
            messagingSenderId: "813261960972",
            appId: "1:813261960972:web:6f6daa3767a42a5d7f7b29",
            measurementId: "G-ZXZRERG20V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const monsters = [
            "ドスジャグラス","クルルヤック","プケプケ","プケ亜種","ボルボロス","ドスギルオス","トビカガチ","トビカガチ亜種","パオウルムー","パオウルムー亜種","ジュラトドス","アンジャナフ","アンジャナフ亜種","リオレイア","リオレイア亜種","リオレイア希少種",
            "レイギエナ","ディアブロス","ディアブロス亜種","リオレウス","リオレウス亜種","リオレウス希少種", "ラドバルキン", "バフバロ", "ベリオロス", "ジンオウガ","ジンオウガ亜種","ツィツィヤック","オドガロン","オドガロン亜種","イビルジョー","バサルモス","フルフル",
            "タマミツネ","アケノシルム","ラージャン","マガイマガド","ウルクスス","ラングロトラ","イソネミクニ","ティガレックス","ティガレックス亜種","バゼルギウス","チャタカブラ","アオアシラ","ディノバルド","ドスフロギィ","ビシュテンゴ","ブラントドス","ナルガクルガ",
            "ルナガロン","ガランゴルム","エスピナス","ケマトリス","ゴシャハギ","ライゼクス","オロミドロ","セルレギオス","ショウグンギザミ",
            "テオ・テスカトル","クシャルダオラ","ネルギガンテ","キリン","オオナズチ","ネロミェール","メル・ゼナ","",
        ];

        const userMap = {
            user1: "拓斗",
            user2: "天飛"
        };

        let currentUser = "user1";
        let globalState = {};

        const monsterGrid = document.getElementById("monsterGrid");
        window.changeUser = () => {
            currentUser = document.getElementById("userSelect").value;
            renderMyList();
            renderFriendsList();
        };

        // 星の表示を自動整形する賢い関数
        function formatStars(starStr) {
            if (!starStr || starStr === "all" || starStr === true || starStr === "true") return "指定なし";
            
            const stars = starStr.split(",").map(Number).sort((a, b) => a - b);
            if (stars.length === 0) return "指定なし";
            
            // 連続しているかチェック（例: 8,9,10 は連続）
            let isConsecutive = true;
            for (let i = 1; i < stars.length; i++) {
                if (stars[i] !== stars[i-1] + 1) {
                    isConsecutive = false;
                    break;
                }
            }
            
            if (isConsecutive && stars.length > 1) {
                return `★${stars[0]}〜${stars[stars.length-1]}`;
            } else {
                return stars.map(s => `★${s}`).join("・");
            }
        }

        function renderMyList() {
            monsterGrid.innerHTML = "";
            const myData = globalState[currentUser] || {};
            
            monsters.forEach(monster => {
                const starValue = myData[monster]; // "all", "8,9", または undefined
                const isWanted = starValue !== undefined && starValue !== null;
                
                const card = document.createElement("div");
                card.className = `monster-card ${isWanted ? 'wanted' : ''}`;
                
                // モンスター名と現在の選択星
                const nameDiv = document.createElement("div");
                nameDiv.className = "monster-name";
                let statusSubText = "";
                if (isWanted) {
                    statusSubText = `<div style="font-size:11px; color:var(--accent-color); margin-top:2px;">(${formatStars(starValue)})</div>`;
                }
                nameDiv.innerHTML = `<span>${monster}</span>${statusSubText}`;
                card.appendChild(nameDiv);
                
                // カードの枠自体をタップ ➔ ON/OFF（指定なし切り替え）
                card.onclick = () => toggleMonster(monster, starValue);
                
                // 星選択用の小ボタンたち
                const starContainer = document.createElement("div");
                starContainer.className = "star-container";
                
                const activeStars = (starValue && starValue !== "all" && starValue !== true && starValue !== "true") 
                    ? starValue.split(",") 
                    : [];
                
                ["5", "6", "7", "8", "9", "10"].forEach(star => {
                    const starBtn = document.createElement("div");
                    starBtn.className = `star-btn ${activeStars.includes(star) ? 'active' : ''}`;
                    starBtn.innerText = `★${star}`;
                    
                    // 星パッチをタップしたときの処理
                    starBtn.onclick = (e) => {
                        e.stopPropagation(); // カード全体のクリックイベントを打ち消す
                        clickStar(monster, starValue, star);
                    };
                    starContainer.appendChild(starBtn);
                });
                
                card.appendChild(starContainer);
                monsterGrid.appendChild(card);
            });
        }

        // カード全体のON/OFF
        function toggleMonster(monster, currentStarValue) {
            const isWanted = currentStarValue !== undefined && currentStarValue !== null;
            globalState[currentUser] = globalState[currentUser] || {};
            
            if (isWanted) {
                delete globalState[currentUser][monster];
                set(ref(db, `sharing-list/${currentUser}/${monster}`), null);
            } else {
                globalState[currentUser][monster] = "all"; // 最初は指定なしでON
                set(ref(db, `sharing-list/${currentUser}/${monster}`), "all");
            }
            renderMyList();
            renderFriendsList();
        }

        // 星を個別にポチポチしたとき
        function clickStar(monster, currentStarValue, clickedStar) {
            globalState[currentUser] = globalState[currentUser] || {};
            
            let activeStars = [];
            if (currentStarValue && currentStarValue !== "all" && currentStarValue !== true && currentStarValue !== "true") {
                activeStars = currentStarValue.split(",");
            }
            
            if (activeStars.includes(clickedStar)) {
                activeStars = activeStars.filter(s => s !== clickedStar); // すでにあったら消す
            } else {
